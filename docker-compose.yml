services:
  backend:
    build:
      context: ./src
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - ./content:/app/content
      - ./src:/app/src
    environment:
      - RUNNING_IN_DOCKER=true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    stdin_open: true
    tty: true
